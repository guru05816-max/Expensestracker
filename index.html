<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos Ko — Personal Expenses Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d1a;
    --bg2: #12122a;
    --bg3: #1a1a3e;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8e8f0;
    --muted: #8888aa;
    --muted2: #555577;
    --accent: #4ECDC4;
    --accent2: #9B59B6;
    --danger: #FF6B6B;
    --warn: #FFE66D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .header {
    background: linear-gradient(135deg, #12122a 0%, #1a1a3e 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px 0;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .logo-name { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }
  .month-label { font-size: 12px; color: var(--muted); }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border2);
    border-radius: 14px; padding: 12px 14px;
  }
  .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 4px; }
  .stat-value { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.2; }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .budget-section { padding-bottom: 16px; }
  .budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .budget-header span { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .budget-edit-btn {
    font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; font-weight: 700; font-family: inherit;
  }
  .budget-bar-wrap { background: var(--bg3); border-radius: 8px; height: 10px; overflow: hidden; margin-bottom: 5px; }
  .budget-bar-fill { height: 100%; border-radius: 8px; transition: width 0.6s ease, background 0.3s; }
  .budget-pct { font-size: 11px; text-align: right; }
  .budget-edit-row { display: flex; gap: 8px; }
  .tabs { display: flex; }
  .tab {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 12px; font-weight: 600;
    cursor: pointer; border: none; background: none; color: var(--muted);
    letter-spacing: 0.3px; border-bottom: 2px solid transparent;
    transition: all 0.2s; font-family: inherit;
  }
  .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  .body { padding: 18px 16px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; margin-bottom: 16px;
  }
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--muted);
    letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px;
  }
  .filter-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 14px; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .chip {
    white-space: nowrap; padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .chip.active-all { background: rgba(78,205,196,0.15); color: var(--accent); border-color: rgba(78,205,196,0.4); }
  .sort-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sort-row span { font-size: 12px; color: var(--muted2); }
  .sort-btn {
    font-size: 11px; color: var(--muted); background: none;
    border: 1px solid var(--border2); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-family: inherit;
  }
  .exp-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .exp-item:last-child { border-bottom: none; }
  .exp-left { flex: 1; }
  .exp-desc { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
  .exp-meta { display: flex; align-items: center; gap: 6px; }
  .exp-date { font-size: 11px; color: var(--muted2); }
  .exp-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .exp-amount { font-size: 15px; font-weight: 800; color: var(--danger); font-family: 'DM Mono', monospace; }
  .exp-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: rgba(255,255,255,0.07); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn.del { background: rgba(255,107,107,0.15); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 20px; padding: 3px 10px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
  }
  label.field-label { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; display: block; margin-bottom: 6px; font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; background: var(--bg3); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-size: 14px; outline: none; font-family: inherit;
    transition: border-color 0.2s; appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: rgba(78,205,196,0.5); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-group { margin-bottom: 12px; }
  .btn-primary {
    width: 100%; padding: 13px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    letter-spacing: 0.5px; font-family: inherit; margin-top: 4px;
  }
  .btn-cancel {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.13); background: transparent;
    color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 8px;
  }
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-icon { font-size: 20px; width: 28px; }
  .cat-info { flex: 1; }
  .cat-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .cat-name { font-size: 13px; font-weight: 600; color: #c8c8e0; }
  .cat-amount { font-size: 13px; font-weight: 800; font-family: 'DM Mono', monospace; }
  .mini-bar { background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  .cat-pct { font-size: 11px; color: var(--muted2); width: 32px; text-align: right; }
  .summary-row {
    display: flex; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { font-size: 13px; color: var(--muted); }
  .summary-val { font-size: 13px; font-weight: 700; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted2); }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }
  .empty-title { font-weight: 600; margin-bottom: 4px; }
  .empty-sub { font-size: 12px; }
  #budget-bar-section { display: block; }
  #budget-edit-section { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">
      <div class="logo-icon">💸</div>
      <div>
        <div class="logo-name">Gastos Ko</div>
        <div class="logo-sub">Personal Tracker</div>
      </div>
    </div>
    <div class="month-label" id="month-label"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">This Month</div>
      <div class="stat-value" id="stat-month">₱0.00</div>
      <div class="stat-sub" id="stat-month-count">0 transactions</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Budget Left</div>
      <div class="stat-value" id="stat-left" style="color:var(--accent)">₱0.00</div>
      <div class="stat-sub" id="stat-budget-of">of ₱15,000.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">All Time</div>
      <div class="stat-value" id="stat-total">₱0.00</div>
      <div class="stat-sub" id="stat-total-count">0 entries</div>
    </div>
  </div>

  <div class="budget-section">
    <div class="budget-header">
      <span>Monthly Budget</span>
      <button class="budget-edit-btn" onclick="toggleBudgetEdit()">Edit</button>
    </div>
    <div id="budget-bar-section">
      <div class="budget-bar-wrap">
        <div class="budget-bar-fill" id="budget-bar" style="width:0%;background:var(--accent)"></div>
      </div>
      <div class="budget-pct" id="budget-pct" style="color:var(--accent)">0% used</div>
    </div>
    <div id="budget-edit-section">
      <div class="budget-edit-row">
        <input type="number" id="budget-input" placeholder="Budget amount" style="flex:1;padding:9px 12px;font-size:13px" />
        <button onclick="saveBudget()" style="padding:9px 16px;border-radius:8px;background:var(--accent);border:none;color:#0d0d1a;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px">Save</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('transactions', this)">📋 Transactions</button>
    <button class="tab" onclick="switchTab('add', this)" id="add-tab-btn">➕ Add Expense</button>
    <button class="tab" onclick="switchTab('analytics', this)">📊 Analytics</button>
  </div>
</div>

<div class="body">

  <div class="panel active" id="panel-transactions">
    <div class="filter-row" id="filter-row"></div>
    <div class="sort-row">
      <span id="entry-count">0 entries</span>
      <button class="sort-btn" onclick="toggleSort()" id="sort-btn">↓ Newest</button>
    </div>
    <div class="card" id="txn-list"></div>
  </div>

  <div class="panel" id="panel-add">
    <div class="card">
      <div class="section-title" id="form-title">New Expense</div>
      <div class="form-group">
        <label class="field-label">Description</label>
        <input type="text" id="f-desc" placeholder="e.g. Jollibee lunch, Grab ride..." />
      </div>
      <div class="form-row">
        <div>
          <label class="field-label">Amount (₱)</label>
          <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01" />
        </div>
        <div>
          <label class="field-label">Date</label>
          <input type="date" id="f-date" />
        </div>
      </div>
      <div class="form-group">
        <label class="field-label">Category</label>
        <select id="f-category"></select>
      </div>
      <div style="margin-bottom:14px" id="badge-preview"></div>
      <button class="btn-primary" onclick="submitForm()" id="submit-btn">➕ Add Expense</button>
      <button class="btn-cancel" id="cancel-btn" onclick="cancelEdit()" style="display:none">Cancel</button>
    </div>
  </div>

  <div class="panel" id="panel-analytics">
    <div class="card">
      <div class="section-title">Spending by Category</div>
      <div id="cat-chart"></div>
    </div>
    <div class="card">
      <div class="section-title">Top Expenses</div>
      <div id="top-expenses"></div>
    </div>
    <div class="card">
      <div class="section-title">Summary</div>
      <div id="summary-list"></div>
    </div>
  </div>

</div>

<script>
const CATEGORIES = [
  { id: "food",          label: "Food & Dining",  icon: "🍜", color: "#FF6B6B" },
  { id: "transport",     label: "Transport",       icon: "🚌", color: "#4ECDC4" },
  { id: "shopping",      label: "Shopping",        icon: "🛍️", color: "#FFE66D" },
  { id: "utilities",     label: "Utilities",       icon: "💡", color: "#A8E6CF" },
  { id: "health",        label: "Health",          icon: "💊", color: "#FF8B94" },
  { id: "entertainment", label: "Entertainment",   icon: "🎬", color: "#DDA0DD" },
  { id: "savings",       label: "Savings",         icon: "🏦", color: "#98D8C8" },
  { id: "other",         label: "Other",           icon: "📦", color: "#C9B1FF" },
];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let expenses = [
  { id: 1, desc: "Jollibee lunch",  amount: 185,  category: "food",          date: "2026-05-08" },
  { id: 2, desc: "MRT load",        amount: 100,  category: "transport",     date: "2026-05-07" },
  { id: 3, desc: "Netflix sub",     amount: 299,  category: "entertainment", date: "2026-05-05" },
  { id: 4, desc: "Meralco bill",    amount: 2800, category: "utilities",     date: "2026-05-03" },
  { id: 5, desc: "Vitamins",        amount: 450,  category: "health",        date: "2026-05-02" },
  { id: 6, desc: "Grocery run",     amount: 1320, category: "food",          date: "2026-05-01" },
];

let budget = 15000;
let filterCat = "all";
let sortDesc = true;
let editId = null;
const today = new Date();

function fmt(n) {
  return "₱" + Number(n).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function getCat(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[7]; }
function formatDate(d) {
  const dt = new Date(d + "T00:00:00");
  return MONTHS[dt.getMonth()] + " " + dt.getDate();
}
function badgeHTML(catId, small) {
  const c = getCat(catId);
  const p = small ? "2px 8px" : "4px 12px";
  const fs = small ? "11px" : "12px";
  return `<span class="badge" style="background:${c.color}22;color:${c.color};border:1px solid ${c.color}44;padding:${p};font-size:${fs}">${c.icon} ${c.label}</span>`;
}

function calcStats() {
  const m = today.getMonth(), y = today.getFullYear();
  const total = expenses.reduce((s,e) => s + e.amount, 0);
  const monthExp = expenses.filter(e => { const d = new Date(e.date + "T00:00:00"); return d.getMonth()===m && d.getFullYear()===y; });
  const monthTotal = monthExp.reduce((s,e) => s + e.amount, 0);
  const pct = Math.min(100, (monthTotal / budget) * 100);
  const color = pct > 90 ? "#FF6B6B" : pct > 70 ? "#FFE66D" : "#4ECDC4";
  document.getElementById("stat-month").textContent = fmt(monthTotal);
  document.getElementById("stat-month-count").textContent = monthExp.length + " transactions";
  document.getElementById("stat-left").textContent = fmt(Math.max(0, budget - monthTotal));
  document.getElementById("stat-left").style.color = color;
  document.getElementById("stat-budget-of").textContent = "of " + fmt(budget);
  document.getElementById("stat-total").textContent = fmt(total);
  document.getElementById("stat-total-count").textContent = expenses.length + " entries";
  document.getElementById("budget-bar").style.width = pct + "%";
  document.getElementById("budget-bar").style.background = color;
  document.getElementById("budget-pct").textContent = pct.toFixed(0) + "% used";
  document.getElementById("budget-pct").style.color = color;
  document.getElementById("month-label").textContent = MONTHS[today.getMonth()] + " " + today.getFullYear();
}

function renderFilters() {
  const row = document.getElementById("filter-row");
  let html = `<button class="chip ${filterCat==='all'?'active-all':''}" onclick="setFilter('all')">All</button>`;
  CATEGORIES.forEach(c => {
    const isActive = filterCat === c.id;
    const style = isActive ? `background:${c.color}22;color:${c.color};border-color:${c.color}55` : "";
    html += `<button class="chip" style="${style}" onclick="setFilter('${c.id}')">${c.icon} ${c.label}</button>`;
  });
  row.innerHTML = html;
}

function setFilter(cat) { filterCat = cat; renderFilters(); renderTransactions(); }

function toggleSort() {
  sortDesc = !sortDesc;
  document.getElementById("sort-btn").textContent = sortDesc ? "↓ Newest" : "↑ Oldest";
  renderTransactions();
}

function renderTransactions() {
  let list = filterCat === "all" ? [...expenses] : expenses.filter(e => e.category === filterCat);
  list.sort((a,b) => sortDesc ? new Date(b.date)-new Date(a.date) : new Date(a.date)-new Date(b.date));
  document.getElementById("entry-count").textContent = list.length + " entries";
  const el = document.getElementById("txn-list");
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🫙</div><div class="empty-title">Walang entries</div><div class="empty-sub">Add your first expense!</div></div>`;
    return;
  }
  el.innerHTML = list.map(exp => `
    <div class="exp-item">
      <div class="exp-left">
        <div class="exp-desc">${exp.desc}</div>
        <div class="exp-meta">${badgeHTML(exp.category, true)}<span class="exp-date">· ${formatDate(exp.date)}</span></div>
      </div>
      <div class="exp-right">
        <div class="exp-amount">${fmt(exp.amount)}</div>
        <div class="exp-actions">
          <button class="icon-btn" onclick="editExpense(${exp.id})">✏️</button>
          <button class="icon-btn del" onclick="deleteExpense(${exp.id})">🗑️</button>
        </div>
      </div>
    </div>
  `).join("");
}

function renderAnalytics() {
  const total = expenses.reduce((s,e) => s + e.amount, 0);
  const map = {};
  expenses.forEach(e => { map[e.category] = (map[e.category]||0) + e.amount; });
  const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]);
  const maxVal = sorted[0]?.[1] || 1;
  const chartEl = document.getElementById("cat-chart");
  if (!sorted.length) {
    chartEl.innerHTML = `<div class="empty"><div>No data yet</div></div>`;
  } else {
    chartEl.innerHTML = sorted.map(([catId, amt]) => {
      const c = getCat(catId);
      const w = Math.min(100, (amt/maxVal)*100);
      const pct = total ? ((amt/total)*100).toFixed(0) : 0;
      return `<div class="cat-row">
        <div class="cat-icon">${c.icon}</div>
        <div class="cat-info">
          <div class="cat-header">
            <span class="cat-name">${c.label}</span>
            <span class="cat-amount" style="color:${c.color}">${fmt(amt)}</span>
          </div>
          <div class="mini-bar"><div class="mini-bar-fill" style="width:${w}%;background:${c.color}"></div></div>
        </div>
        <div class="cat-pct">${pct}%</div>
      </div>`;
    }).join("");
  }
  const top = [...expenses].sort((a,b) => b.amount-a.amount).slice(0,5);
  const topEl = document.getElementById("top-expenses");
  if (!top.length) {
    topEl.innerHTML = `<div class="empty"><div>No data yet</div></div>`;
  } else {
    topEl.innerHTML = top.map((exp,i) => `
      <div class="exp-item">
        <div style="width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);margin-right:10px;flex-shrink:0">${i+1}</div>
        <div class="exp-left">
          <div style="font-size:13px;font-weight:600">${exp.desc}</div>
          <div style="margin-top:4px">${badgeHTML(exp.category, true)}</div>
        </div>
        <div class="exp-amount" style="font-size:14px">${fmt(exp.amount)}</div>
      </div>
    `).join("");
  }
  const avg = expenses.length ? total/expenses.length : 0;
  const highest = expenses.length ? Math.max(...expenses.map(e=>e.amount)) : 0;
  const m = today.getMonth(), y = today.getFullYear();
  const monthTotal = expenses.filter(e=>{ const d=new Date(e.date+"T00:00:00"); return d.getMonth()===m&&d.getFullYear()===y; }).reduce((s,e)=>s+e.amount,0);
  const pct = Math.min(100,(monthTotal/budget)*100);
  const summaryData = [
    ["Total Expenses", fmt(total)],
    ["Average per Entry", fmt(avg)],
    ["Highest Single", fmt(highest)],
    ["This Month", fmt(monthTotal)],
    ["Budget Used", pct.toFixed(1)+"%"],
  ];
  document.getElementById("summary-list").innerHTML = summaryData.map(([l,v]) => `
    <div class="summary-row">
      <span class="summary-label">${l}</span>
      <span class="summary-val">${v}</span>
    </div>
  `).join("");
}

function renderCategorySelect() {
  const sel = document.getElementById("f-category");
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join("");
  sel.addEventListener("change", updateBadgePreview);
}

function updateBadgePreview() {
  document.getElementById("badge-preview").innerHTML = badgeHTML(document.getElementById("f-category").value, false);
}

function submitForm() {
  const desc = document.getElementById("f-desc").value.trim();
  const amount = parseFloat(document.getElementById("f-amount").value);
  const date = document.getElementById("f-date").value;
  const category = document.getElementById("f-category").value;
  if (!desc || !amount || amount <= 0 || !date) return;
  if (editId !== null) {
    expenses = expenses.map(e => e.id === editId ? {...e, desc, amount, date, category} : e);
    cancelEdit();
  } else {
    expenses.push({ id: Date.now(), desc, amount, date, category });
    document.getElementById("f-desc").value = "";
    document.getElementById("f-amount").value = "";
  }
  renderAll();
  switchTabById("transactions");
}

function cancelEdit() {
  editId = null;
  document.getElementById("form-title").textContent = "New Expense";
  document.getElementById("submit-btn").textContent = "➕ Add Expense";
  document.getElementById("cancel-btn").style.display = "none";
  document.getElementById("f-desc").value = "";
  document.getElementById("f-amount").value = "";
  document.getElementById("f-date").value = today.toISOString().slice(0,10);
  document.getElementById("f-category").value = "food";
  updateBadgePreview();
}

function editExpense(id) {
  const exp = expenses.find(e => e.id === id);
  if (!exp) return;
  editId = id;
  document.getElementById("f-desc").value = exp.desc;
  document.getElementById("f-amount").value = exp.amount;
  document.getElementById("f-date").value = exp.date;
  document.getElementById("f-category").value = exp.category;
  document.getElementById("form-title").textContent = "Edit Expense";
  document.getElementById("submit-btn").textContent = "💾 Save Changes";
  document.getElementById("cancel-btn").style.display = "block";
  updateBadgePreview();
  switchTabById("add");
}

function deleteExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  if (editId === id) cancelEdit();
  renderAll();
}

function toggleBudgetEdit() {
  const bar = document.getElementById("budget-bar-section");
  const edit = document.getElementById("budget-edit-section");
  const btn = document.querySelector(".budget-edit-btn");
  if (edit.style.display === "none") {
    edit.style.display = "block";
    bar.style.display = "none";
    document.getElementById("budget-input").value = budget;
    btn.textContent = "";
  }
}

function saveBudget() {
  const val = parseFloat(document.getElementById("budget-input").value);
  if (val > 0) budget = val;
  document.getElementById("budget-bar-section").style.display = "block";
  document.getElementById("budget-edit-section").style.display = "none";
  document.querySelector(".budget-edit-btn").textContent = "Edit";
  renderAll();
}

function switchTab(name, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("panel-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "add") { document.getElementById("add-tab-btn").textContent = editId ? "✏️ Edit Expense" : "➕ Add Expense"; }
  if (name === "analytics") renderAnalytics();
}

function switchTabById(name) {
  const tabs = document.querySelectorAll(".tab");
  const idx = ["transactions","add","analytics"].indexOf(name);
  if (idx >= 0) switchTab(name, tabs[idx]);
}

function renderAll() {
  calcStats();
  renderFilters();
  renderTransactions();
}

document.getElementById("f-date").value = today.toISOString().slice(0,10);
renderCategorySelect();
updateBadgePreview();
renderAll();
</script>
</body>
</html>
